name: llms-from-scratch

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # ==========================================================
  # Python
  # ==========================================================
  - python=3.12

  # ==========================================================
  # Scientific Computing
  # ==========================================================
  - numpy
  - scipy
  - pandas
  - matplotlib

  # ==========================================================
  # Jupyter
  # ==========================================================
  - jupyterlab
  - notebook
  - ipykernel

  # ==========================================================
  # Machine Learning
  # ==========================================================
  - scikit-learn

  # ==========================================================
  # PyTorch
  # ==========================================================
  - pytorch
  - torchvision
  - torchaudio

  # ==========================================================
  # Utilities
  # ==========================================================
  - tqdm
  - pyyaml
  - requests

  # ==========================================================
  # pip packages
  # ==========================================================
  - pip

  - pip:
      # Hugging Face
      - transformers
      - tokenizers
      - datasets
      - accelerate
      - safetensors
      - evaluate

      # Visualization
      - plotly
      - seaborn

      # Terminal output
      - rich

      # Formatting
      - black
      - isort
      - ruff

      # Testing
      - pytest
